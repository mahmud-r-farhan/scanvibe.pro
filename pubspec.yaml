name: scanvibe_pro
description: "ScanVibe: an offline document scanner with on-device OCR and searchable PDF export."
publish_to: 'none'

version: 0.0.1+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter
  intl: 0.20.2
  shared_preferences: ^2.5.5
  uuid: ^4.5.3
  collection: ^1.19.1
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  pdf: ^3.13.0
  printing: ^5.15.0
  google_mlkit_text_recognition: ^0.16.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.jpg"
  adaptive_icon_background: "#0E1324"
  adaptive_icon_foreground: "assets/logo.jpg"

flutter_native_splash:
  color: "#FCFDFF"
  image: "assets/scanvibe.jpg"
  android_12:
    image: "assets/scanvibe.jpg"
    color: "#FCFDFF"
